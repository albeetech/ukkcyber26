name: ukk-cyber-lab

services:
  web-internal:
    build:
      context: ./web-internal
    container_name: ukk-web-internal
    restart: unless-stopped
    ports:
      - "${SERVER_IP:-192.168.50.10}:${WEB_INTERNAL_PORT:-8080}:8080"
    volumes:
      - ./logs/web-internal:/var/log/nginx
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.50
    networks:
      internal_net:
        ipv4_address: 172.31.50.10
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health.txt | grep -q '^OK$'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web-vuln:
    build:
      context: ./web-vuln
    container_name: ukk-web-vuln
    restart: unless-stopped
    ports:
      - "${SERVER_IP:-192.168.50.10}:${WEB_VULN_PORT:-8081}:5000"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      LAB_NAME: UKK Cybersecurity Web Lab
      JWT_SECRET: ukk-jwt-secret-2026
      FLASK_SECRET: ukk-flask-session-2026
    volumes:
      - vuln_data:/app/data
      - ./logs/web-vuln:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 150
    mem_limit: 256m
    cpus: 0.75
    networks:
      vuln_net:
        ipv4_address: 172.31.60.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()==b'OK'" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

networks:
  internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.50.0/24
  vuln_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.60.0/24

volumes:
  vuln_data:
