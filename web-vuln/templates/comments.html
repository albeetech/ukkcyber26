{% extends "base.html" %}{% block content %}<h2>Guestbook Lab</h2><div class="grid"><div class="card"><form method="post"><label>Nama</label><input name="author" value="siswa"><label>Pesan</label><textarea name="content" rows="6"></textarea><button>Kirim Komentar</button></form></div><div><h3>Komentar Terbaru</h3>{% for c in comments %}<div class="card"><strong>{{ c.author }}</strong><p>{{ c.content }}</p><small>{{ c.created_at }}</small></div>{% else %}<p>Belum ada komentar.</p>{% endfor %}</div></div>{% endblock %}
