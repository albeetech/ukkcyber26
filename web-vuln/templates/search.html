{% extends "base.html" %}{% block content %}<h2>Pencarian Inventaris</h2><form method="get"><input name="q" value="{{ q }}" placeholder="Cari perangkat atau layanan"><button>Cari</button></form>{% if q %}<div class="card"><p>Hasil pencarian untuk: <strong>{{ q }}</strong></p></div>{% endif %}<div class="grid">{% for p in products %}<div class="card"><h3>{{ p['name'] }}</h3><p>{{ p['description'] }}</p></div>{% endfor %}</div>{% endblock %}
