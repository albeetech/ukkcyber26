log_format ukk '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" rt=$request_time';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # BASELINE UKK: sengaja belum di-hardening sepenuhnya.
    server_tokens on;

    access_log /var/log/nginx/access.log ukk;
    error_log  /var/log/nginx/error.log warn;

    location = /health.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # BASELINE UKK: directory listing sengaja aktif untuk bahan audit.
    location /download/ {
        autoindex on;
        try_files $uri $uri/ =404;
    }
}
